spring:
  application:
    name: product
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:mariadb://localhost:3306/product
    username: root
    password: 123459
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  liquibase:
    enabled: false