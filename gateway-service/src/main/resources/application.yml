server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**
          filters:
            # Filter đơn giản: thêm header để backend biết request đi qua gateway (Tuần 2 – API Gateway).
            - AddRequestHeader=X-Gateway-Route, order-service
        # Demo N+1 của order cũng đi qua gateway (path /api/demo/orders/**).
        - id: order-demo
          uri: http://localhost:8083
          predicates:
            - Path=/api/demo/orders/**
          filters:
            - AddRequestHeader=X-Gateway-Route, order-demo

# Expose actuator prometheus endpoint for metrics scraping
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
